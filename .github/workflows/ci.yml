name: CLI CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install CLI dependencies
        run: npm ci
      - name: Run CLI tests
        run: npm test
      - name: Check CLI entry point syntax
        run: node --check bin/cdis.js
